name: Build WG2600HP NSS integrated RAM candidate (one-shot)
# This workflow does not change or revive the intentionally emptied
# build-wg2600hp-nss.yml. One isolated-branch push triggers the build once.
on:
  push:
    branches:
      - wg2600hp-nss-integrated-candidate-20261101
    paths:
      - .github/workflows/build-wg2600hp-one-shot-20261101.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wg2600hp-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - name: Install OpenWrt build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd
      - name: Restore downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: wg2600hp-source-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'diff-wg2600hp-nss') }}
          restore-keys: |
            wg2600hp-source-${{ runner.os }}-
      - name: Resolve WG2600HP source, feeds and target configuration
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip
          cp diff-wg2600hp-nss .config
          make defconfig
          grep -Fx 'LINUX_VERSION-6.12 = .112' target/linux/generic/kernel-6.12
          for opt in CONFIG_TARGET_ipq806x_generic_DEVICE_nec_wg2600hp CONFIG_TARGET_ROOTFS_INITRAMFS CONFIG_PACKAGE_kmod-qca-nss-gmac CONFIG_PACKAGE_kmod-qca-nss-drv CONFIG_PACKAGE_kmod-qca-nss-ecm-standard CONFIG_PACKAGE_kmod-qca-nss-drv-tunipip6 CONFIG_NSS_DRV_TUNIPIP6_ENABLE CONFIG_NSS_DRV_IPV6_ENABLE CONFIG_NSS_DRV_WIFI_ENABLE CONFIG_PACKAGE_MAC80211_NSS_SUPPORT; do
            grep -Fx "${opt}=y" .config || { echo "Missing target requirement: ${opt}"; exit 1; }
          done
          cp .config wg2600hp-resolved.config
      - name: Download source
        run: make -j8 download
      - name: Compile complete WG2600HP firmware (not isolated object tests)
        run: |
          echo "FIRMWARE_BUILD=START"
          make -j$(nproc)
          echo "FIRMWARE_BUILD=COMPLETE"
      - name: Verify generated WG2600HP images and embedded DTB and NSS modules
        run: |
          sh scripts/wg2600hp_nss_image_gate.sh
          mkdir -p out
          find bin/targets/ipq806x/generic -maxdepth 1 -type f -name '*nec_wg2600hp-*' -exec cp {} out/ \;
          cp wg2600hp-resolved.config out/
          for p in bin/targets/ipq806x/generic/*nec_wg2600hp*.manifest; do
            if test -f "$p"; then cp "$p" out/; fi
          done
          (cd out && sha256sum * > SHA256SUMS)
          git rev-parse HEAD > out/SOURCE_COMMIT
          ls -lh out/
          echo "FIRMWARE_OUTPUT=UNVERIFIED_RAM_CANDIDATE"
      - name: Upload real firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WG2600HP-IPQ8064-25.12.6-NSS-RAM-UNVERIFIED
          path: out/
          retention-days: 30
