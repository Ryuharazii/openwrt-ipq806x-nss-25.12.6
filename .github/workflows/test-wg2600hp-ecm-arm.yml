name: WG2600HP isolated ECM ARM cross compilation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecm-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and kernel dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf flex bison bc libssl-dev libelf-dev make git patch
      - name: Build pinned ECM interface and NSS IPv4 frontend ARM C objects
        timeout-minutes: 19
        run: python3 scripts/wg2600hp_kernel_integrated_preflight.py --arm-ecm
      - name: Scope
        run: echo "ECM ARM objects only; no firmware, no RAM boot, no flash."
