name: WG2600HP isolated ARM DSA object compilation (not firmware)

on:
  push:
    branches: [wg2600hp-nss-integrated-candidate-20261101]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-dsa-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross-compiler and kernel host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf flex bison bc libssl-dev libelf-dev make
      - name: Rebuild 6.12.112 pinned patched source and compile selected ARM DSA objects
        timeout-minutes: 20
        run: python3 scripts/wg2600hp_kernel_integrated_preflight.py --arm-objects
      - name: Explicit scope
        run: echo "ARM OBJECTS ONLY; NOT A FULL OPENWRT BUILD; NO RAM BOOT; NO NSS CREATE ACK"
