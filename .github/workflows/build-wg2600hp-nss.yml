name: Build WG2600HP NSS 25.12.6

on:
  push:
    branches:
      - 'wg2600hp-nss-*'
  workflow_dispatch:

concurrency:
  group: wg2600hp-nss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wg2600hp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      # Restore fetches before feeds/download. If the inputs change, OpenWrt
      # still fetches missing or changed files rather than using stale outputs.
      - name: Restore sources and feeds cache
        id: sources-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            feeds
            dl
          key: wg2600hp-sources-v1-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'diff-wg2600hp-nss') }}
          restore-keys: |
            wg2600hp-sources-v1-${{ runner.os }}-

      # Never cache kernel build_dir/target-* or staging_dir/target-*:
      # these can conceal DTS/kernel patch modifications from incremental make.
      - name: Restore host tools and cross toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: wg2600hp-toolchain-v1-${{ runner.os }}-${{ hashFiles('diff-wg2600hp-nss', 'tools/**', 'toolchain/**', 'include/**', 'target/linux/generic/kernel-6.12') }}

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: wg2600hp-ccache-v1-${{ runner.os }}-${{ hashFiles('diff-wg2600hp-nss', 'toolchain/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wg2600hp-ccache-v1-${{ runner.os }}-${{ hashFiles('diff-wg2600hp-nss', 'toolchain/**') }}-

      - name: Configure WG2600HP only
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip
          cp diff-wg2600hp-nss .config
          make defconfig
          grep -Fx 'LINUX_VERSION-6.12 = .112' target/linux/generic/kernel-6.12
          for option in CONFIG_TARGET_ipq806x_generic_DEVICE_nec_wg2600hp CONFIG_TARGET_ROOTFS_INITRAMFS CONFIG_PACKAGE_kmod-qca-nss-gmac CONFIG_PACKAGE_kmod-qca-nss-drv CONFIG_PACKAGE_kmod-qca-nss-ecm-standard CONFIG_PACKAGE_kmod-qca-nss-drv-tunipip6 CONFIG_NSS_DRV_TUNIPIP6_ENABLE CONFIG_NSS_DRV_IPV6_ENABLE CONFIG_DEVEL CONFIG_CCACHE; do
            grep -Fx "${option}=y" .config || exit 1
          done
          cp .config wg2600hp-resolved.config

      - name: Cross-component static preflight
        run: |
          sh -n target/linux/ipq806x/base-files/usr/sbin/wg2600hp-net-audit
          test "$(git ls-files --stage target/linux/ipq806x/base-files/usr/sbin/wg2600hp-net-audit | awk '{print $1}')" = 100755
          python3 -m py_compile scripts/wg2600hp_cross_audit.py scripts/wg2600hp_verify_embedded_dtb.py
          python3 scripts/wg2600hp_cross_audit.py
          python3 -m unittest discover -s tests -p 'test_wg2600hp_cross_audit.py' -v

      - name: Download source archives
        run: make -j8 download

      # Cache sources as soon as downloads succeed, even if compilation fails.
      - name: Save downloaded sources and feeds
        if: steps.sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            feeds
            dl
          key: wg2600hp-sources-v1-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'diff-wg2600hp-nss') }}

      # Explicit checkpoint: on a cold runner the expensive toolchain is
      # saved before compiling kernel/packages, so later failures do not
      # discard the usable toolchain cache.
      - name: Prepare host tools and toolchain
        run: |
          make -j$(nproc) tools/install
          make -j$(nproc) toolchain/install

      - name: Save host tools and toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: wg2600hp-toolchain-v1-${{ runner.os }}-${{ hashFiles('diff-wg2600hp-nss', 'tools/**', 'toolchain/**', 'include/**', 'target/linux/generic/kernel-6.12') }}

      - name: Report cache reuse
        run: |
          echo "Sources cache hit: ${{ steps.sources-cache.outputs.cache-hit }}"
          echo "Toolchain cache hit: ${{ steps.toolchain-cache.outputs.cache-hit }}"
          du -sh dl feeds staging_dir/host staging_dir/toolchain-* .ccache 2>/dev/null || true

      - name: Build firmware
        run: make -j$(nproc)

      # Save compiler outputs even when the firmware fails to compile.
      - name: Compiler cache statistics
        if: always()
        run: |
          if test -x staging_dir/host/bin/ccache; then
            staging_dir/host/bin/ccache --show-stats
          else
            echo "ccache not yet installed"
          fi

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: wg2600hp-ccache-v1-${{ runner.os }}-${{ hashFiles('diff-wg2600hp-nss', 'toolchain/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and stage WG2600HP images
        run: |
          sh scripts/wg2600hp_nss_image_gate.sh
          mkdir -p out
          find bin/targets/ipq806x/generic -maxdepth 1 -type f -name '*nec_wg2600hp-*' -exec cp {} out/ \;
          test -n "$(find out -maxdepth 1 -type f -name '*.bin' -o -name '*initramfs*')"
          cp wg2600hp-resolved.config out/
          cp bin/targets/ipq806x/generic/*.manifest out/ || true
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: WG2600HP-IPQ8064-25.12.6-NSS
          path: out/
          retention-days: 30
