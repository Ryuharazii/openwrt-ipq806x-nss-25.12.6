name: WG2600HP swconfig NSS 25.12.6 isolated firmware

# Manual invocation only after the five project gates are satisfied.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swconfig:
    if: github.ref_name == 'wg2600hp-swconfig-integration-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source and swconfig boot-to-network dependencies
        run: |
          git rev-parse HEAD | tee build-source-sha.txt
          dts=target/linux/ipq806x/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq8064-wg2600hp.dts
          grep -Fq 'qca,ar8327-initvals' "$dts"
          ! grep -Eq 'dsa-tag-protocol|qca,qca8337' "$dts"
          net=target/linux/ipq806x/base-files/etc/board.d/02_network
          grep -Fq '"6@eth1" "1:wan" "0@eth0"' "$net"
          ns=target/linux/ipq806x/patches-6.12/990-0001-Add-required-entries-in-dts-files-for-NSS-support.patch
          grep -Fq 'nss-common {' "$ns"
          grep -Fq 'nss-gmac-common {' "$ns"
          grep -Fq 'qcom,tunipip6-enabled;' "$ns"
          grep -Fxq 'LINUX_VERSION-6.12 = .112' target/linux/generic/kernel-6.12
          grep -Fxq 'PKG_MIRROR_HASH:=91f2189ee0410bd9cd3bd85f4fd70ddc7799f85e27d2a8246e0b5835b2b97315' package/qca-nss/qca-nss-gmac/Makefile
          grep -Fxq 'PKG_MIRROR_HASH:=5dd11f3cb619a5967f214785263a4ddfaa1bede817b8859f512722b8663262df' package/qca-nss/qca-nss-drv/Makefile
          grep -Fxq 'PKG_MIRROR_HASH:=7dd1cdd176e677015ee914afd2cfd996833dc52d9ebac45f3994d0264e4d33a1' package/qca-nss/qca-mcs/Makefile
          grep -Fxq 'PKG_MIRROR_HASH:=69cbbed3932548c37ffad787c95a74a4880335d3c615b51a75d09da7e578284b' package/qca-nss/qca-nss-clients/Makefile
          printf 'SOURCE_GRAPH=PASS_STATIC\nG1_HARDWARE=UNVERIFIED\nG2_RUNTIME=UNVERIFIED\nFLASH=PROHIBITED\n' > build-gates.tsv
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
      - name: Install toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd
      - name: Configure WG2600HP only
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip
          cp diff-wg2600hp-nss .config
          make defconfig
          for option in CONFIG_TARGET_ipq806x_generic_DEVICE_nec_wg2600hp CONFIG_TARGET_ROOTFS_INITRAMFS CONFIG_PACKAGE_kmod-qca-nss-gmac CONFIG_PACKAGE_kmod-qca-nss-drv CONFIG_PACKAGE_kmod-qca-nss-ecm-standard CONFIG_PACKAGE_kmod-qca-nss-drv-tunipip6 CONFIG_NSS_DRV_TUNIPIP6_ENABLE CONFIG_NSS_DRV_IPV6_ENABLE CONFIG_NSS_DRV_WIFI_ENABLE CONFIG_PACKAGE_MAC80211_NSS_SUPPORT; do
            grep -Fx "$option=y" .config
          done
          cp .config wg2600hp-resolved.config
      - name: Fetch all archives and verify checksums
        run: make -j8 download
      - name: Build ARM firmware and retain compiler output
        run: |
          set -o pipefail
          if timeout 5h make -j$(nproc) 2>&1 | tee build.log; then
            printf 'ARM_BUILD=PASS\n' >> build-gates.tsv
          else
            printf 'PARALLEL_BUILD=FAIL\n' >> build-gates.tsv
            timeout 45m make -j1 V=s 2>&1 | tee -a build.log
            printf 'ARM_BUILD=PASS_AFTER_SERIAL_RETRY\n' >> build-gates.tsv
          fi
      - name: Verify WG2600HP firmware images
        run: |
          mkdir -p out
          find bin/targets/ipq806x/generic -maxdepth 1 -type f -name '*nec_wg2600hp-*' -exec cp {} out/ \;
          test -n "$(find out -maxdepth 1 -name '*nec_wg2600hp-initramfs-uImage' -print -quit)"
          test -n "$(find out -maxdepth 1 -name '*nec_wg2600hp-squashfs-sysupgrade.bin' -print -quit)"
          manifest="$(find bin/targets/ipq806x/generic -maxdepth 1 -name '*nec_wg2600hp.manifest' -print -quit)"
          test -n "$manifest"
          cp "$manifest" out/
          for pkg in kmod-qca-nss-drv kmod-qca-nss-gmac kmod-qca-nss-ecm-standard kmod-qca-nss-drv-tunipip6; do
            grep -Eq "^$pkg[[:space:]]" "$manifest"
          done
          printf 'IMAGE_GATE=PASS\nRAM_BOOT=UNVERIFIED\nWIRED_IPV4_NSS=UNVERIFIED\nWIFI_NSS=UNVERIFIED\nFIXED_IPIP6_NSS=UNVERIFIED\nFLASH=PROHIBITED\n' >> build-gates.tsv
          cp wg2600hp-resolved.config build-gates.tsv build-source-sha.txt out/
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out
      - name: Preserve images and failure logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WG2600HP-swconfig-25.12.6-NSS
          path: |
            out/
            build.log
            build-source-sha.txt
            build-gates.tsv
            wg2600hp-resolved.config
          if-no-files-found: warn
          retention-days: 30
